#:schema node_modules/wrangler/config-schema.json
name = "unstop-router"
main = "src/index.ts"
compatibility_date = "2026-01-15"

# 自定义域名（绑定在账号管理的 hw365.top zone 下）
routes = [
  { pattern = "usrouter.hw365.top", custom_domain = true }
]
workers_dev = true

# 前端静态资源（首页 / 管理控制台）
[assets]
directory = "./public"
binding = "ASSETS"

# KV 存储：先运行 `npx wrangler kv namespace create KV`，
# 然后把返回的 id 替换到下面（本地 dev 无需真实 id）。
[[kv_namespaces]]
binding = "KV"
id = "24f3efa629b64907a264fc6a26369017"

[observability]
enabled = true
